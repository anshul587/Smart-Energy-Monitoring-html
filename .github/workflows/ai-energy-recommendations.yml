name: AI energy recommendations

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: ai-energy-recs
  cancel-in-progress: false

jobs:
  run-recommendations:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      DATA_SOURCE: live
      PZEM_COUNT: "9"
      HISTORY_RETENTION_DAYS: "60"
      BILL_RATE_PER_KWH: "5.0"
      AI_CACHE_DIR: ./.cache
      SCHEDULER_ENABLED: "true"
      SCHEDULER_LOG_LEVEL: INFO
      FIREBASE_DATABASE_URL: "https://smart-energy-monitoring-5a2a4-default-rtdb.asia-southeast1.firebasedatabase.app"
      FIREBASE_SERVICE_ACCOUNT_PATH: ./secrets/firebase-service-account.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ai-backend/requirements.txt

      - name: Install dependencies
        working-directory: ai-backend
        run: pip install -r requirements.txt

      - name: Write Firebase service account JSON
        working-directory: ai-backend
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          mkdir -p secrets
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > ./secrets/firebase-service-account.json

      - name: Cache AI cache
        uses: actions/cache@v4
        with:
          path: ai-backend/.cache
          key: ai-cache-${{ runner.os }}-${{ hashFiles('ai-backend/requirements.txt') }}
          restore-keys: |
            ai-cache-${{ runner.os }}-

      - name: Run one-shot scheduler
        working-directory: ai-backend
        run: python -m ai.scheduler --once

      - name: Upload reports artifact
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: ai-recommendations-reports
          path: ai-backend/reports
          if-no-files-found: ignore
